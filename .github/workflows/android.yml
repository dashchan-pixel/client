name: Release

# Pushing a version tag in major.minor(.patch) form (e.g. 26.7.5) equal to the newest
# metadata/versions.json entry builds the release APK, publishes it as a GitHub release
# and refreshes update/data-v1.json on the default branch so the update manifest hashes
# the exact published binary.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check signing secret
        run: |
          if [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "RELEASE_KEYSTORE_BASE64 secret is not set; a locally generated" \
                 "keystore would break the update fingerprint check" >&2
            exit 1
          fi

      - name: Verify tag matches the newest version
        run: |
          name=$(python3 -c "import json; print(max(json.load(open('metadata/versions.json'))['versions'], key=lambda v: v['code'])['name'])")
          if [ "$name" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match newest version $name" >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Decode signing keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build release APK
        env:
          KEYSTORE_FILENAME: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_SIGN_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_SIGN_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Prepare release asset and changelog
        id: release_meta
        run: |
          code=$(python3 -c "import json; print(max(json.load(open('metadata/versions.json'))['versions'], key=lambda v: v['code'])['code'])")
          cp build/outputs/apk/release/dashchan-redacted-release.apk "dashchan-redacted-$code.apk"
          echo "apk=dashchan-redacted-$code.apk" >> "$GITHUB_OUTPUT"
          echo "changelog=metadata/en/changelogs/$code.txt" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ steps.release_meta.outputs.changelog }}
          files: ${{ steps.release_meta.outputs.apk }}

      - name: Refresh update manifest on the default branch
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          git worktree add ../manifest "origin/$BRANCH"
          python3 scripts/update_manifest.py \
              build/outputs/apk/release/dashchan-redacted-release.apk \
              ../manifest/update/data-v1.json "$GITHUB_REF_NAME"
          cd ../manifest
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update/data-v1.json
          git commit -m "Update manifest for $GITHUB_REF_NAME" || exit 0
          git push origin "HEAD:$BRANCH"
